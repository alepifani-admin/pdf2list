[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2list"
version = "1.1.1"
description = "Trasforma listini PDF in Excel e CSV (macOS Intel/Apple Silicon, Windows)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "PDF2LIST"}]
keywords = ["pdf", "excel", "csv", "listino", "price list", "ocr"]
dependencies = [
  "PySide6>=6.6,<7",
  "PyMuPDF==1.24.14",
  "openpyxl>=3.1,<4",
  "numpy>=1.24,<3",
  "Pillow>=10,<14",
  "rapidocr-onnxruntime>=1.3,<2",
  "keyring>=24,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.8"]

[project.scripts]
pdf2list = "pdf2list.__main__:main"
pdf2list-cli = "pdf2list.cli:main"

[project.gui-scripts]
pdf2list-gui = "pdf2list.__main__:main"

[tool.setuptools]
include-package-data = true
packages = ["pdf2list", "pdf2list.core", "pdf2list.ui", "pdf2list.resources"]

[tool.setuptools.package-data]
pdf2list = [
  "resources/profiles/*.json",
  "resources/icons/*.png",
  "resources/icons/*.ico",
  "resources/icons/*.icns",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
